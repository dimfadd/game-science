<style>
  /* Wayang Bayangan: game-specific styles only.
   * Rule (CLAUDE.md): CSS transforms only on elements WITHOUT a transform attribute. */
  .gs-stage { background: #2A2030; }
  .gs-stage .t-body { font-family: var(--font-body); font-weight: 700; }
  .wy-pup > g { transition: filter 200ms ease-out; }
  .wy-dim { filter: brightness(0.62) saturate(0.8); }
  .wy-grab > g { filter: brightness(1.12) drop-shadow(0 6px 6px rgba(0, 0, 0, 0.45)); }
  .wy-wob { animation: wy-wob 420ms ease-in-out; transform-box: view-box; transform-origin: 0 0; }
  @keyframes wy-wob { 25% { rotate: -4deg; } 60% { rotate: 3deg; } 85% { rotate: -1deg; } }
  .wy-shake { animation: wy-shake 450ms ease-in-out; }
  @keyframes wy-shake { 20% { translate: -7px 0; } 45% { translate: 6px 0; } 70% { translate: -4px 0; } 90% { translate: 2px 0; } }
  .wy-flame { transform-box: fill-box; transform-origin: 50% 80%; animation: wy-flicker 1.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
  @keyframes wy-flicker { 0% { scale: 1 1; } 35% { scale: 0.94 1.06; } 70% { scale: 1.04 0.95; } 100% { scale: 0.97 1.03; } }
  .wy-kglow { animation: wy-kglow 2.3s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
  @keyframes wy-kglow { from { opacity: 0; } to { opacity: 0.16; } }
  .wy-aud.cheer .wy-person { animation: wy-cheer 420ms cubic-bezier(0.34, 1.56, 0.64, 1) 3 alternate; }
  @keyframes wy-cheer { to { translate: 0 -12px; } }
  .wy-tab, [data-hit] { cursor: pointer; }
  .wy-stepper { display: inline-flex; align-items: center; gap: 8px; background: var(--card, #FFF8EC); border: 4px solid var(--line, #3B2A20); border-radius: 999px; padding: 6px; box-shadow: 0 6px 0 var(--line, #3B2A20); }
  .wy-step { width: 64px; height: 64px; border-radius: 999px; border: 3px solid var(--line, #3B2A20); background: var(--secondary, #F28C28); color: #2B1D14; font: 800 38px/1 var(--font-display); cursor: pointer; }
  .wy-step:active { transform: scale(0.92); }
  .wy-step:disabled { opacity: 0.5; }
  .wy-val { min-width: 118px; text-align: center; font: 600 30px/1 var(--font-num); font-variant-numeric: tabular-nums; color: #2B1D14; }
  @media (max-height: 500px) {
    .wy-step { width: 54px; height: 54px; font-size: 32px; }
    .wy-val { min-width: 96px; font-size: 24px; }
    .wy-stepper { padding: 4px; gap: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wy-wob, .wy-shake, .wy-flame, .wy-kglow, .wy-aud.cheer .wy-person { animation: none; }
  }
</style>
</head>
<body class="gs-game landscape-only">
<svg class="gs-stage" id="stage" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid meet" aria-label="Panggung wayang: geser wayang di antara lampu dan kelir"></svg>

</body>
</html>
