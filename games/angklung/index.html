<style>
  /* Angklung Ajaib: game-specific styles only.
   * Rule (CLAUDE.md): CSS transforms only on elements WITHOUT a transform attribute
   * (.ak-in, .ak-tubes, .ak-pop are untransformed inner groups). */
  .gs-stage { background: #E8CF9E; }
  .gs-stage .t-body { font-family: var(--font-body); font-weight: 700; }
  [data-hit], .ak-grab { cursor: pointer; }
  /* a ringing tube: the tubes shiver, the vibration marks show (works with sound off) */
  .ak-ring .ak-tubes { animation: ak-vib 64ms linear infinite alternate; }
  @keyframes ak-vib { from { translate: -2.2px 0; } to { translate: 2.2px 0; } }
  .ak-lines { opacity: 0; transition: opacity 120ms ease-out; }
  .ak-ring .ak-lines { opacity: 1; }
  .ak-sway { transform-box: view-box; animation: ak-sway 2.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
  .ak-sway.d1 { animation-delay: -0.9s; } .ak-sway.d2 { animation-delay: -1.7s; }
  @keyframes ak-sway { from { rotate: -1.6deg; } to { rotate: 1.6deg; } }
  .ak-hl { animation: ak-hl 380ms cubic-bezier(0.34, 1.56, 0.64, 1); transform-box: fill-box; transform-origin: center; }
  @keyframes ak-hl { 40% { scale: 1.16; } }
  .ak-pop { animation: ak-pop 300ms cubic-bezier(0.34, 1.56, 0.64, 1); transform-box: fill-box; transform-origin: center; }
  @keyframes ak-pop { from { scale: 0.4; opacity: 0.2; } }
  .ak-hop { animation: ak-hop 420ms cubic-bezier(0.34, 1.56, 0.64, 1) 2 alternate; }
  @keyframes ak-hop { to { translate: 0 -16px; } }
  .ak-zz { animation: ak-zz 2.2s ease-in-out infinite; }
  @keyframes ak-zz { 0% { opacity: 0; translate: 0 6px; } 30% { opacity: 1; } 100% { opacity: 0; translate: 8px -26px; } }
  .ak-blink { animation: ak-blink 900ms ease-in-out infinite; }
  @keyframes ak-blink { 50% { opacity: 0.35; } }
  .ak-wind { animation: ak-wind 2.4s linear infinite; }
  @keyframes ak-wind { from { translate: -40px 0; opacity: 0; } 30% { opacity: 0.7; } to { translate: 60px 0; opacity: 0; } }
  .ak-fogfade { transition: opacity 900ms ease-out; }
  .gs-action[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .ak-ring .ak-tubes, .ak-sway, .ak-hl, .ak-pop, .ak-hop, .ak-zz, .ak-blink, .ak-wind { animation: none; }
  }
</style>
</head>
<body class="gs-game landscape-only">
<svg class="gs-stage" id="stage" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid meet" aria-label="Sanggar angklung: susun, goyang, dan mainkan angklung"></svg>
