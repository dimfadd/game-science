<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angkot Penuh!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@800&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="../../shared/core.css">
<style>
  /* Angkot Penuh! game-specific styles */
  .ak path, .ak rect, .ak circle, .ak ellipse, .ak line, .ak polygon { stroke-linejoin: round; stroke-linecap: round; }
  .ak-group, .ak-hit, .ak-btn { cursor: pointer; }
  .ak-group:focus, .ak-hit:focus, .ak-btn:focus { outline: none; }
  .ak-group:focus-visible .ak-ring, .ak-hit:focus-visible ~ .ak-ring, .ak-btn:focus-visible .ak-ring { display: inline; }
  .ak-ring { display: none; }
  .ak-idle { animation: ak-idle 0.24s linear infinite alternate; }
  @keyframes ak-idle { from { transform: translateY(0); } to { transform: translateY(-1.3px); } }
  .ak-rumble { animation: ak-rumble 0.2s linear infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes ak-rumble { 0%, 100% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(3px, -2px) rotate(0.6deg); } 75% { transform: translate(-3px, 1px) rotate(-0.6deg); } }
  .ak-breathe { animation: ak-breathe 2.4s cubic-bezier(0.37, 0, 0.63, 1) infinite; }
  @keyframes ak-breathe { 50% { transform: translateY(-3px); } }
  .ak-bob { animation: ak-bob 0.5s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
  @keyframes ak-bob { from { transform: translateY(0); } to { transform: translateY(-7px); } }
  .ak-bounce { animation: ak-bounce 0.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
  @keyframes ak-bounce { from { transform: translateY(-6px); } to { transform: translateY(8px); } }
  .ak-blink { animation: ak-blink 4.3s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ak-blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(0.12); } }
  .ak-stomp { animation: ak-stomp 0.32s ease-in-out infinite alternate; }
  @keyframes ak-stomp { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  .ak-sway { animation: ak-sway 3.2s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
  @keyframes ak-sway { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }
  .ak-markpulse { animation: ak-markpulse 0.9s ease-in-out infinite alternate; }
  @keyframes ak-markpulse { from { opacity: 0.35; } to { opacity: 1; } }
  .gs-action.ak-nudge { animation: ak-nudge 0.5s ease-in-out 3; }
  @keyframes ak-nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .gs-action[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .ak-idle, .ak-rumble, .ak-breathe, .ak-bob, .ak-bounce, .ak-stomp, .ak-sway, .ak-markpulse, .gs-action.ak-nudge { animation: none; }
  }
</style>
</head>
<body class="gs-game landscape-only">
<svg class="gs-stage" id="stage" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid meet" aria-label="Area permainan: terminal angkot"></svg>
<div class="gs-dock" id="dock"></div>
<script src="../../shared/core.js"></script>
<script src="../../shared/art.js"></script>
<script src="game.js"></script>
</body>
</html>
