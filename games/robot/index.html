<style>
  /* Chuppy Jalan-jalan: game-specific styles only. Animations only on inner groups or on
     elements without a transform attribute (SVG animation rule, CLAUDE.md). */
  .gs-stage .rb-hit { cursor: pointer; }
  .gs-stage .rb-hit:focus { outline: none; }
  .gs-stage .rb-hit:focus-visible .rb-face { stroke: #1F6FD1; stroke-width: 6; }
  .rb-caret { animation: rb-blink 1s steps(2, start) infinite; }
  @keyframes rb-blink { to { visibility: hidden; } }
  .rb-glow { animation: rb-glow 700ms ease-in-out infinite alternate; }
  @keyframes rb-glow { from { opacity: 0.55; } to { opacity: 1; } }
  .rb-pulse { animation: rb-pulse 1.4s ease-in-out infinite; }
  @keyframes rb-pulse { 50% { opacity: 0.45; } }
  .rb-dim { opacity: 0.42; }
  .gs-action[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .rb-caret, .rb-glow, .rb-pulse { animation: none; }
  }
</style>
</head>
<body class="gs-game landscape-only">
<svg class="gs-stage" id="stage" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid meet" aria-label="Chuppy jalan-jalan: susun kartu panah supaya robot Chuppy sampai tujuan"></svg>
