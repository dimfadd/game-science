<style>
  /* Bengkel Kayu: game-specific styles only. Animations only on inner groups without a transform attribute. */
  .tk-breathe { animation: tk-breathe 2.4s cubic-bezier(0.37, 0, 0.63, 1) infinite; }
  @keyframes tk-breathe { 50% { transform: translateY(-3px); } }
  .tk-hint { transform-box: fill-box; transform-origin: center; animation: tk-hint 1.1s cubic-bezier(0.37, 0, 0.63, 1) infinite; }
  @keyframes tk-hint { 50% { transform: scale(1.1); } }
  .tk-glow { animation: tk-glow 900ms ease-in-out infinite; }
  @keyframes tk-glow { 50% { opacity: 0.35; } }
  .gs-stage .tk-hit { cursor: pointer; }
  .gs-stage .tk-grab { cursor: grab; }
  .gs-action[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .tk-breathe, .tk-hint, .tk-glow { animation: none; }
  }
</style>
</head>
<body class="gs-game landscape-only">
<svg class="gs-stage" id="stage" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid meet" aria-label="Bengkel kayu: ukur, potong, dan susun kayu"></svg>
